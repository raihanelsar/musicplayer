<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://kit.fontawesome.com/9203d3003f.js" crossorigin="anonymous"></script>
  <link rel="icon" href="media/RE.png" type="image/x-icon">
</head>
<body>

<div class="container">
  <div class="music-player">
    <nav>
      <div class="circle">
        <i class="fa-solid fa-angle-left"></i>
      </div>
      <h2 class="logo">My Player</h2>
      <div class="circle">
        <i class="fa-solid fa-bars"></i>
      </div>
    </nav>

    <div class="song-info">
      <img src="media/thumbnail.jpg" class="song-img">
      <h1>BYE BYE BYE</h1>
      <p>N SYNC</p>
    </div>

    <audio id="song">
      <source src="media/deadpool.mp3" type="audio/mpeg">
    </audio>

    <div class="progress-container">
      <input type="range" value="0" id="progress">
      <div class="time">
        <span id="currentTime">0:00</span>
        <span id="duration">3:45</span>
      </div>
    </div>

    <div class="controls">
      <div class="btn"><i class="fa-solid fa-backward"></i></div>
      <div class="btn play-btn" onclick="playPause()">
        <i class="fa-solid fa-play" id="ctrlIcon"></i>
      </div>
      <div class="btn"><i class="fa-solid fa-forward"></i></div>
    </div>

  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
